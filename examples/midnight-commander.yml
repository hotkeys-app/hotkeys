# Midnight Commander runs inside a terminal window, so the thing to match on is the window
# title, not the app. Reading titles needs the Screen Recording permission, and a license.
#
# The title differs per terminal. Bind displayActiveWindowInfo() to a key, press it with mc
# in front, and copy the part of the title that is always there into currentWindowContains.

macros:
    MC: currentWindowContains("— mc ")

hotkeys:
    insert:
        MC: sendKeys("control-t")       # select file, the insert key of every other file manager
    ^h:
        MC: sendKeys("control-a")       # directory history